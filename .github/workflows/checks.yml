name: checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [ master ]
  workflow_call:

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3

      - name: Run all checks
        run: lgx check
